name: Release — build .app and .exe

# Draft pipeline for the fork's private, non-commercial learning builds.
# Produces an unsigned macOS .app (app-image) and a Windows .exe installer
# (requires WiX 3.x on the runner).
#
# Not tested here — it only runs on a GitHub release. install4j (upstream)
# remains the production path for openpnp/openpnp; this workflow is for this
# fork and does NOT deploy anything.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn -q -B package -DskipTests

      - name: Stage
        run: |
          mkdir -p staging
          cp target/openpnp-gui-0.0.1-alpha-SNAPSHOT.jar staging/
          cp -r target/lib staging/lib

      - name: Package .app
        run: |
          VERSION="$(cat VERSION.txt).0"
          jpackage --type app-image --name OpenPnP --app-version "$VERSION" \
            --description "OpenPnP - Open Source SMT Pick and Place" \
            --vendor "OpenPnP" \
            --input staging \
            --main-jar openpnp-gui-0.0.1-alpha-SNAPSHOT.jar \
            --main-class org.openpnp.Main \
            --dest dist \
            --icon src/main/resources/icons/OpenPnP-logo.icns \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/java.awt=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/java.awt.color=ALL-UNNAMED"

      - name: Smoke test
        run: ./dist/OpenPnP.app/Contents/MacOS/OpenPnP --version

      - name: Zip .app (release assets need a single file)
        run: cd dist && zip -r OpenPnP.app.zip OpenPnP.app

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPnP-macos-app
          path: dist/OpenPnP.app.zip
          retention-days: 30

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenPnP.app.zip

  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX 3 (required by jpackage for .exe)
        run: choco install wixtoolset --yes

      - name: Build
        run: mvn -q -B package -DskipTests

      - name: Stage
        shell: bash
        run: |
          mkdir -p staging
          cp target/openpnp-gui-0.0.1-alpha-SNAPSHOT.jar staging/
          cp -r target/lib staging/lib

      - name: Package .exe
        shell: bash
        run: |
          VERSION="$(cat VERSION.txt).0"
          jpackage --type exe --name OpenPnP --app-version "$VERSION" \
            --description "OpenPnP - Open Source SMT Pick and Place" \
            --vendor "OpenPnP" \
            --input staging \
            --main-jar openpnp-gui-0.0.1-alpha-SNAPSHOT.jar \
            --main-class org.openpnp.Main \
            --dest dist \
            --icon src/main/resources/icons/OpenPnP.ico \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/java.awt=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/java.awt.color=ALL-UNNAMED"

      - name: Smoke test (app-image launcher)
        shell: bash
        run: |
          jpackage --type app-image --name OpenPnP --app-version "$(cat VERSION.txt).0" \
            --input staging \
            --main-jar openpnp-gui-0.0.1-alpha-SNAPSHOT.jar \
            --main-class org.openpnp.Main \
            --dest dist-appimage \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/java.awt=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/java.awt.color=ALL-UNNAMED"
          ./dist-appimage/OpenPnP/OpenPnP.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPnP-windows-exe
          path: dist/*.exe
          retention-days: 30

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
